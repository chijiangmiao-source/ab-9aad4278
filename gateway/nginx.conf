upstream coordinator_api {
    server api-a:8000;
    server api-b:8000;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://coordinator_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
    }
}
