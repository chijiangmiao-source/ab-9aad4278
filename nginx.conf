upstream coordinator_api {
    least_conn;
    server api1:8000 max_fails=3 fail_timeout=5s;
    server api2:8000 max_fails=3 fail_timeout=5s;
}

server {
    listen 80;

    location / {
        proxy_pass http://coordinator_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        # Retry the next API instance on connect errors / stale backends.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}
