name: cryoem-coordinator

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coordinator
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coordinator"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    build: .
    command: ["python", "-m", "app.migrate"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/coordinator
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api1: &api
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/coordinator
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz',timeout=2).status==200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api2:
    <<: *api

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${API_PORT:-8000}:80"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    restart: unless-stopped

  verify:
    build: .
    command: ["python", "-m", "verify.verify"]
    environment:
      API_BASE: http://gateway:80
      DATABASE_URL: postgresql://postgres:postgres@db:5432/coordinator
    depends_on:
      gateway:
        condition: service_started
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    restart: "no"

volumes:
  db_data:
