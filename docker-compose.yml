name: pipeline-coordinator

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 2s
      timeout: 3s
      retries: 30

  api-a:
    build: .
    environment:
      DATABASE_URL: postgresql://scheduler:scheduler@db:5432/scheduler
      SWEEP_INTERVAL_SECONDS: "1"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s

  api-b:
    build: .
    environment:
      DATABASE_URL: postgresql://scheduler:scheduler@db:5432/scheduler
      SWEEP_INTERVAL_SECONDS: "1"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${API_PORT:-8080}:80"
    depends_on:
      api-a:
        condition: service_healthy
      api-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40

  verify:
    build: .
    command: ["python", "-m", "verify.verify"]
    environment:
      API_BASE_URL: http://gateway
      API_A_URL: http://api-a:8000
      API_B_URL: http://api-b:8000
      DATABASE_URL: postgresql://scheduler:scheduler@db:5432/scheduler
      VERIFY_SCALE: "2000"
    depends_on:
      gateway:
        condition: service_healthy
    restart: "no"

volumes:
  db_data:
